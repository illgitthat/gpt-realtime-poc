name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (production is allowed only from main)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      dry_run:
        description: Run Wrangler in dry-run mode instead of deploying
        required: true
        default: true
        type: boolean

concurrency:
  group: cloudflare-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Reject production dispatch from a feature branch
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "Production deployments and production dispatches require the main ref."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test and typecheck
        run: npm test && npm run test:deployment && npm run typecheck

      - name: Validate production and isolated preview bundles
        run: npm run deploy:dry-run && npm run deploy:preview:dry-run

      - name: Deploy isolated preview with atomic runtime configuration
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'preview' && !inputs.dry_run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_PREVIEW_ENV: ${{ secrets.LIVE_PREVIEW_ENV }}
        run: npm run deploy:preview

      - name: Deploy production with atomic runtime configuration
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.target == 'production' && !inputs.dry_run))
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_PRODUCTION_ENV: ${{ secrets.LIVE_PRODUCTION_ENV }}
        run: npm run deploy:production
