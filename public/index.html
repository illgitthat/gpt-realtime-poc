<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f5">
  <title>Voice chat</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body data-state="idle" data-launch="true">
  <div class="shell">
    <header class="header">
      <a class="brand" href="./" aria-label="Voice chat home">Voice chat</a>
      <div class="header-actions">
        <div id="session-status" class="status-row" hidden>
          <span id="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">Ready when you are</span></span>
          <span id="working" role="status" hidden>Looking into that…</span>
        </div>
        <details id="conversation-actions" class="conversation-actions" hidden>
          <summary aria-label="Conversation actions">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </summary>
          <div class="action-menu">
            <button id="export" class="quiet" type="button" disabled>Export text</button>
            <button id="delete" class="quiet" type="button">Delete conversation</button>
          </div>
        </details>
      </div>
    </header>

    <main id="main" class="workspace">
      <section class="conversation-panel">
        <p id="notice" class="notice" role="alert" hidden></p>
        <p id="context-note" class="small" hidden></p>
        <div class="conversation-stage">
          <section class="conversation" aria-label="Conversation transcript">
            <h2 id="conversation-heading" hidden>Previous conversation</h2>
            <div id="welcome" class="welcome">
              <h1>Start a conversation</h1>
              <p id="welcome-description">Talk about anything.</p>
            </div>
            <section id="focus-panel" class="focus-panel" aria-label="Current activity" hidden>
              <p id="focus-context" class="focus-context"></p>
              <div class="focus-card">
                <p id="focus-label" class="focus-eyebrow"></p>
                <h1 id="focus-title" dir="auto"></h1>
                <p id="focus-reading" dir="auto" hidden></p>
                <p id="focus-meaning" dir="auto" hidden></p>
                <button id="repeat-phrase" type="button" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Zm12-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>
                  Hear again
                </button>
              </div>
            </section>
            <details id="transcript-panel" open>
              <summary id="transcript-summary" hidden>Transcript</summary>
              <div id="transcript" role="log" aria-label="Live captions" aria-live="off"></div>
              <button id="latest" class="quiet latest" type="button" aria-label="Jump to latest content" hidden>↓ Latest</button>
            </details>
          </section>

          <footer class="controls">
            <div class="buttons">
              <button id="start" class="primary" type="button">
                <span class="mic-disc" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="2" width="8" height="13" rx="4"/>
                    <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>
                  </svg>
                </span>
                <span id="start-label" role="status">Start conversation</span>
              </button>
              <button id="continue" type="button" hidden>Continue</button>
              <button id="fresh" type="button" hidden>Start new</button>
              <button id="mute" class="call-button" type="button" aria-label="Mute microphone" aria-pressed="false" hidden>
                <span class="call-disc" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/><path class="mic-slash" d="m3 3 18 18"/></svg>
                </span>
                <span>Mute</span>
              </button>
              <button id="end" class="call-button end" type="button" aria-label="End conversation" hidden>
                <span class="call-disc" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M3 14h3l2-3a16 16 0 0 1 8 0l2 3h3v-3a1 1 0 0 0-.3-.7C18.3 7.4 15.2 6 12 6S5.7 7.4 3.3 10.3a1 1 0 0 0-.3.7Z"/></svg>
                </span>
                <span id="end-label">End</span>
              </button>
            </div>
            <button id="resume-audio" class="resume" type="button" hidden>Tap to hear the assistant</button>
            <p id="control-note" class="small" hidden></p>
          </footer>
        </div>
      </section>

      <aside class="setup-panel" aria-label="Conversation settings">
        <section class="setup">
          <div class="setup-heading">
            <h2>Conversation mode</h2>
          </div>
          <div class="modes" role="group" aria-label="Conversation mode">
            <button type="button" data-mode="general" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.5-4A8 8 0 1 1 20 11.5Z"/><path d="M8 10h8M8 14h5"/></svg>
              <span class="mode-name">General</span>
              <span class="mode-description">Talk about anything</span>
            </button>
            <button type="button" data-mode="tutor" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h12M9 3v2M6 5c0 6 3 8 7 10M12 5c0 6-3 8-7 10M13 21l4-10 4 10M14.5 17h5"/></svg>
              <span class="mode-name">Language tutor</span>
              <span class="mode-description">Practice with guided help</span>
            </button>
            <button type="button" data-mode="interview" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12c5 3 13 3 18 0M10 13v3h4v-3"/></svg>
              <span class="mode-name">Mock interview</span>
              <span class="mode-description">Practice and get feedback</span>
            </button>
          </div>
          <button id="open-settings" class="settings-link" type="button" aria-haspopup="dialog" aria-controls="settings-dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg>
            <span id="settings-summary">Voice &amp; settings</span>
            <span aria-hidden="true">›</span>
          </button>
        </section>
      </aside>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="sheet-heading">
      <h2 id="settings-title">Conversation settings</h2>
      <button id="close-settings" class="quiet" type="button" autofocus>Done</button>
    </div>
    <p id="settings-lock-note" class="small" hidden>End the conversation to change these settings.</p>
    <fieldset id="settings">
      <legend class="sr-only">Conversation settings</legend>
      <div id="tutor-settings" class="mode-settings" hidden>
        <label>Language <input id="language" maxlength="80" placeholder="e.g. Chinese, Spanish" list="languages" autocomplete="off"></label>
        <datalist id="languages"><option value="Chinese"><option value="Spanish"><option value="French"><option value="Japanese"><option value="Arabic"><option value="English"><option value="Korean"><option value="German"><option value="Hindi"><option value="Portuguese"></datalist>
        <label>Level <select id="level"><option value="">Let’s find out</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label>
        <label>Explain in <input id="support-language" maxlength="80" placeholder="Optional, e.g. English" autocomplete="off"></label>
      </div>
      <div id="interview-settings" class="mode-settings" hidden>
        <label>Role <input id="role" maxlength="160" placeholder="Optional, e.g. Product designer"></label>
        <label>Style <select id="interview-style"><option value="practice">Practice · feedback as you go</option><option value="simulation">Simulation · feedback at the end</option></select></label>
      </div>
      <details class="advanced">
        <summary>Voice &amp; instructions</summary>
        <div class="advanced-settings">
          <label>Voice
            <select id="voice">
              <option value="marin">Marin · default</option>
              <option value="quartz">Quartz · Australian</option>
              <option value="ripple">Ripple · Australian</option>
              <option value="vesper">Vesper · British</option>
              <option value="willow">Willow · Irish</option>
              <option value="stone">Stone · Irish</option>
              <option value="gleam">Gleam · North American</option>
              <option value="meridian">Meridian · North American</option>
              <option value="bossa">Bossa · Brazilian Portuguese</option>
              <option value="tempo">Tempo · Brazilian Portuguese</option>
              <option value="beacon">Beacon · Filipino English</option>
              <option value="delta">Delta · Southern U.S.</option>
              <option value="cinder">Cinder · Southern U.S.</option>
            </select>
          </label>
          <label>Custom instructions
            <textarea id="instructions" rows="3" maxlength="4000" placeholder="Optional: a topic, speaking style, or something to keep in mind."></textarea>
          </label>
        </div>
      </details>
    </fieldset>
  </dialog>
  <audio id="remote-audio" autoplay playsinline></audio>
  <noscript>This voice chat needs JavaScript enabled.</noscript>
</body>
</html>
