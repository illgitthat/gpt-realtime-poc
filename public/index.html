<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>Voice chat</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="./" aria-label="Voice chat home"><span aria-hidden="true">◖</span> Voice chat</a>
      <div class="header-actions">
        <details id="conversation-actions" class="conversation-actions" hidden>
          <summary aria-label="Conversation actions">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </summary>
          <div class="action-menu">
            <button id="export" class="quiet" type="button" disabled>Export text</button>
            <button id="delete" class="quiet" type="button">Delete conversation</button>
          </div>
        </details>
      </div>
    </header>

    <main id="main">
      <section class="setup" aria-label="Conversation settings">
        <fieldset id="settings">
          <legend class="sr-only">Choose a conversation</legend>
          <div class="modes" role="group" aria-label="Conversation mode">
            <button type="button" data-mode="general" aria-pressed="true">General</button>
            <button type="button" data-mode="tutor" aria-pressed="false">Language tutor</button>
            <button type="button" data-mode="interview" aria-pressed="false">Mock interview</button>
          </div>
          <div id="tutor-settings" class="mode-settings" hidden>
            <label>Language <input id="language" maxlength="80" placeholder="e.g. Chinese, Spanish" list="languages" autocomplete="off"></label>
            <datalist id="languages"><option value="Chinese"><option value="Spanish"><option value="French"><option value="Japanese"><option value="Arabic"><option value="English"><option value="Korean"><option value="German"><option value="Hindi"><option value="Portuguese"></datalist>
            <label>Level <select id="level"><option value="">Let’s find out</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label>
            <label>Explain in <input id="support-language" maxlength="80" placeholder="Optional, e.g. English" autocomplete="off"></label>
          </div>
          <div id="interview-settings" class="mode-settings" hidden>
            <label>Role <input id="role" maxlength="160" placeholder="Optional, e.g. Product designer"></label>
            <label>Style <select id="interview-style"><option value="practice">Practice · feedback as you go</option><option value="simulation">Simulation · feedback at the end</option></select></label>
          </div>
          <details class="advanced">
            <summary>Custom instructions</summary>
            <label for="instructions" class="sr-only">Custom instructions</label>
            <textarea id="instructions" rows="3" maxlength="4000" placeholder="Optional: a topic, speaking style, or something to keep in mind."></textarea>
          </details>
        </fieldset>
      </section>

      <p id="notice" class="notice" role="alert" hidden></p>
      <p id="context-note" class="small" hidden></p>
      <section class="conversation" aria-label="Conversation transcript">
        <h2 id="conversation-heading" hidden>Previous conversation</h2>
        <div id="welcome" class="welcome">
          <h1>What’s on your mind?</h1>
        </div>
        <div id="transcript" role="log" aria-label="Live captions" aria-live="off"></div>
        <button id="latest" class="quiet latest" type="button" aria-label="Jump to latest content" hidden>↓ Latest</button>
      </section>
    </main>

    <footer class="controls">
      <div class="status-row">
        <span id="status" role="status"><span class="status-dot" aria-hidden="true"></span><span id="status-text">Ready when you are</span></span>
        <span id="working" role="status" hidden>Looking into that…</span>
      </div>
      <div class="buttons">
        <button id="start" class="primary" type="button">
          <span class="mic-disc" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="2" width="8" height="13" rx="4"/>
              <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>
            </svg>
          </span>
          <span id="start-label" role="status">Start conversation</span>
        </button>
        <button id="continue" type="button" hidden>Continue</button>
        <button id="fresh" type="button" hidden>Start new</button>
        <button id="mute" type="button" aria-pressed="false" hidden>Mute mic</button>
        <button id="stop-talking" class="quiet" type="button" aria-pressed="false" hidden>Mute audio</button>
        <button id="end" class="end" type="button" aria-label="End conversation" hidden>End</button>
      </div>
      <button id="resume-audio" class="resume" type="button" hidden>Tap to hear the assistant</button>
      <p id="control-note" class="small" hidden></p>
    </footer>
  </div>
  <audio id="remote-audio" autoplay playsinline></audio>
  <noscript>This voice chat needs JavaScript enabled.</noscript>
</body>
</html>
